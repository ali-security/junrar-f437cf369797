name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test selector (e.g. test --tests FooTest); empty runs the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - name: Provision JDK 8 for the Gradle toolchain
        id: jdk8
        uses: actions/setup-java@v2
        with:
          java-version: 8
          java-package: 'jdk'
          distribution: 'temurin'
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Register runner JDK 8 for Gradle toolchains
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${{ steps.jdk8.outputs.path }}" >> ~/.gradle/gradle.properties
          echo "org.gradle.java.installations.auto-download=false" >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build
        run: |
          cat > "$RUNNER_TEMP/test-logging.gradle" <<'EOF'
          allprojects {
            tasks.withType(Test).configureEach { t ->
              t.testLogging {
                events 'passed', 'skipped', 'failed'
                exceptionFormat 'full'
              }
              t.afterSuite { desc, result ->
                if (desc.parent == null) {
                  println "TEST SUMMARY ${t.path}: ${result.resultType} - ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
                }
              }
            }
          }
          EOF
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew assemble ${{ inputs.test-filter }} -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest -I "$RUNNER_TEMP/test-logging.gradle"
          else
            ./gradlew build -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest -I "$RUNNER_TEMP/test-logging.gradle"
          fi
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - name: Assemble release jars (as ci/prepare-release.sh)
        if: matrix.java == '8'
        run: |
          ./gradlew assemble jar
          ls -la build/libs
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: build/libs/junrar-7.5.3.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
